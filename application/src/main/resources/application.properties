spring.application.name=devshop
server.port=8080

# RDS values are supplied through environment variables in Kubernetes.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devshop}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
