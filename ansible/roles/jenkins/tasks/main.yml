---
- name: Install Java
  apt:
    name: openjdk-21-jdk
    state: present
    update_cache: true

- name: Create APT keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Jenkins repository key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Add Jenkins repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present
    update_cache: true

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Enable and start Jenkins
  systemd:
    name: jenkins
    enabled: true
    state: started

- name: Install Maven on Jenkins controller
  apt:
    name: maven
    state: present
    update_cache: true

- name: Install kubectl on Jenkins controller
  include_role:
    name: kubectl

- name: Add Jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: true

- name: Restart Jenkins after docker group membership change
  systemd:
    name: jenkins
    state: restarted
