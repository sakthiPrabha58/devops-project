apiVersion: apps/v1
kind: Deployment
metadata:
  name: devshop
  namespace: devshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devshop
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: devshop
    spec:
      nodeSelector:
        node-role: web
      imagePullSecrets:
        - name: nexus-registry-secret
      containers:
        - name: devshop
          image: NEXUS_HOST:8082/devshop:BUILD_NUMBER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: devshop-config
            - secretRef:
                name: devshop-db
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
